<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Nexus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23262d3b'/%3E%3Ccircle cx='10' cy='11' r='3' fill='%238aa4ff'/%3E%3Ccircle cx='22' cy='11' r='3' fill='%2354d6b0'/%3E%3Ccircle cx='16' cy='23' r='3' fill='%23f0b35a'/%3E%3Cpath d='M10 11h12M10 11l6 12M22 11l-6 12' stroke='%238b95a8' stroke-width='1.5' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app" data-side="open" data-ai="open">
    <aside class="side" id="side" aria-label="Tree">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <path d="M9 10h14M9 10l7 13M23 10l-7 13" stroke="currentColor" stroke-opacity=".45" stroke-width="1.6" fill="none"/>
          <circle cx="9" cy="10" r="3.2" fill="var(--c1)"/><circle cx="23" cy="10" r="3.2" fill="var(--c2)"/><circle cx="16" cy="23" r="3.2" fill="var(--c3)"/>
        </svg>
        <span class="brand-name">Nexus</span>
        <button id="btn-new-root" class="icon-btn" type="button" title="New top-level node (Alt+Shift+N)" aria-label="New top-level node"></button>
      </div>
      <div class="search">
        <input id="filter" type="search" placeholder="Filter the tree" aria-label="Filter the tree" autocomplete="off" spellcheck="false">
      </div>
      <div id="tree" class="tree" role="tree" aria-label="Your tree"></div>
      <div class="side-foot">
        <span id="tree-count" class="count"></span>
        <span class="spacer"></span>
        <button id="btn-import" class="icon-btn" type="button" title="Import a JSON export" aria-label="Import"></button>
        <button id="btn-export" class="icon-btn" type="button" title="Export everything as JSON" aria-label="Export"></button>
        <button id="btn-theme" class="icon-btn" type="button"></button>
      </div>
    </aside>

    <main class="stage">
      <header class="top">
        <button id="btn-side" class="icon-btn" type="button" title="Show or hide the tree" aria-label="Show or hide the tree"></button>
        <nav id="crumbs" class="crumbs" aria-label="Location"></nav>
        <div class="views" role="tablist" aria-label="View">
          <button class="view-tab on" role="tab" aria-selected="true" data-view="note" type="button">Note</button>
          <button class="view-tab" role="tab" aria-selected="false" data-view="graph" type="button" title="Alt+G">Graph</button>
          <button class="view-tab" role="tab" aria-selected="false" data-view="agenda" type="button">Follow-ups</button>
        </div>
        <span id="saving" class="saving" data-tone="ok" role="status" aria-live="polite">Saved</span>
        <button id="btn-undo" class="icon-btn" type="button" aria-label="Undo" disabled></button>
        <button id="btn-palette" class="icon-btn" type="button" title="Search and commands (Ctrl+K)" aria-label="Search and commands"></button>
        <button id="btn-ai" class="btn ai-toggle" type="button" title="AI capture (Alt+A)" aria-pressed="true"></button>
      </header>
      <div id="editor" class="view editor"></div>
      <div id="graph" class="view graph" hidden></div>
      <div id="agenda" class="view agenda" hidden></div>
    </main>

    <aside id="ai-panel" class="ai" aria-label="AI assistant"></aside>
    <div id="scrim" class="scrim"></div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <script type="module" src="/icons-boot.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
